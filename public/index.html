<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0b16">
<title>128bit Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23ff9f1c'/><rect x='3' y='9' width='2' height='4' fill='%230b0b16'/><rect x='7' y='6' width='2' height='7' fill='%230b0b16'/><rect x='11' y='3' width='2' height='10' fill='%230b0b16'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="logo"><span class="logo-mark">📊</span>128bit Tracker</div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-view="today"><span class="ico">⚡</span>TODAY</button>
      <button class="tab" data-view="library"><span class="ico">🎮</span>LIBRARY</button>
      <button class="tab" data-view="timeline"><span class="ico">🗓️</span>TIMELINE</button>
      <button class="tab" data-view="stats"><span class="ico">📈</span>STATS</button>
      <button class="tab" data-view="connect"><span class="ico">🔌</span>CONNECT</button>
    </nav>
  </header>
  <main id="view"></main>
</div>
<div id="modal-root"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
