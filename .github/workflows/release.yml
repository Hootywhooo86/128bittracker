name: Release APK

# Push a tag like v0.2.0 (or run manually with a tag name) to publish a
# GitHub Release with the APK attached.
#
# Signing: add these repo secrets so every release is signed with the same
# key (required for updates to install over each other):
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the release is built with a throwaway debug key and marked as
# a pre-release (uninstall the old app before installing a new one).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          IFS=. read -r MA MI PA <<< "${VERSION%%-*}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Tests
        run: |
          npm test
          cd mobile && npm ci && npm test

      - name: Decode signing key
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secrets set; building a debug-signed pre-release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: mobile
        env:
          TRACKER_KEYSTORE_FILE: ${{ steps.sign.outputs.file }}
          TRACKER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TRACKER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TRACKER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm run sync
          cd android
          TASK=${{ steps.sign.outputs.signed == 'true' && 'assembleRelease' || 'assembleDebug' }}
          ./gradlew "$TASK" -PversionName=${{ steps.v.outputs.version }} -PversionCode=${{ steps.v.outputs.code }}
          OUT=$(ls app/build/outputs/apk/*/app-*.apk | head -1)
          cp "$OUT" "$GITHUB_WORKSPACE/128bittracker-${{ steps.v.outputs.tag }}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: 128bit Tracker ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.sign.outputs.signed != 'true' }}
          generate_release_notes: true
          files: 128bittracker-${{ steps.v.outputs.tag }}.apk
          body: |
            **Install:** download `128bittracker-${{ steps.v.outputs.tag }}.apk` on your Android phone and open it (allow installs from your browser/files app when asked).
            ${{ steps.sign.outputs.signed == 'true' && 'Signed release build: installs as an update over earlier signed releases.' || '⚠️ Test build signed with a temporary key. Uninstall the previous version before installing this one, and export your data first (Sync → Export).' }}

            Connecting to 128bitplay: see [mobile/README.md](https://github.com/${{ github.repository }}/blob/${{ steps.v.outputs.tag }}/mobile/README.md).
