name: Release APK

# Publishes a GitHub Release with the APK attached when:
#  - the "version" in mobile/package.json changes on a pushed branch and no
#    release v<version> exists yet (bump the version = ship a release), or
#  - a tag like v0.2.0 is pushed, or it's run manually with a tag name.
#
# Signing (required): every release is signed with the same key so it
# installs as an update. Without these repo secrets the release fails:
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  push:
    tags: ['v*']
    branches: ['**']
    paths: ['mobile/package.json', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"
          else TAG="v$(node -p "require('./mobile/package.json').version")"; fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          VERSION="${TAG#v}"
          IFS=. read -r MA MI PA <<< "${VERSION%%-*}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.v.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        if: steps.v.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Tests
        if: steps.v.outputs.skip != 'true'
        run: |
          npm test
          cd mobile && npm ci && npm test

      - name: Decode signing key
        if: steps.v.outputs.skip != 'true'
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Every release must be signed with the same key, or Android refuses
          # to install it as an update ("App not installed"). No key, no release.
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Signing secrets missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (see mobile/README.md → Signing)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build APK
        if: steps.v.outputs.skip != 'true'
        working-directory: mobile
        env:
          TRACKER_KEYSTORE_FILE: ${{ steps.sign.outputs.file }}
          TRACKER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TRACKER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TRACKER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm run sync
          cd android
          ./gradlew assembleRelease -PversionName=${{ steps.v.outputs.version }} -PversionCode=${{ steps.v.outputs.code }}
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/128bittracker-${{ steps.v.outputs.tag }}.apk"
          # Fail if the APK didn't come out signed with the release key.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          CERT=$("$APKSIGNER" verify --print-certs "$GITHUB_WORKSPACE/128bittracker-${{ steps.v.outputs.tag }}.apk")
          echo "$CERT"
          if echo "$CERT" | grep -q "CN=Android Debug"; then echo "::error::APK is debug-signed"; exit 1; fi

      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.skip != 'true'
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: 128bit Tracker ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          generate_release_notes: true
          files: 128bittracker-${{ steps.v.outputs.tag }}.apk
          body: |
            **Install:** download `128bittracker-${{ steps.v.outputs.tag }}.apk` on your Android phone and open it (allow installs from your browser/files app when asked).
            Signed with the 128bit Tracker release key, so it installs as an update over any earlier signed release.

            Connecting to 128bitplay: see [mobile/README.md](https://github.com/${{ github.repository }}/blob/${{ steps.v.outputs.tag }}/mobile/README.md).
